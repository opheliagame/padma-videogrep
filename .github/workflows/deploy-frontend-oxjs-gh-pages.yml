name: Deploy frontend_oxjs to GH Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

env:
  # Pinned OxJS revision used to build frontend_oxjs/min
  OXJS_REF: 4a81aeeedff73c208f2ef36b712b26d54327867b

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_oxjs/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build OxJS runtime with padmavideogrep theme
        run: |
          git init /tmp/oxjs
          git -C /tmp/oxjs fetch --depth 1 https://code.0x2620.org/0x2620/oxjs.git "$OXJS_REF"
          git -C /tmp/oxjs checkout FETCH_HEAD
          cp -R frontend_oxjs/oxjs-themes/padmavideogrep /tmp/oxjs/source/UI/themes/
          pip install ox
          python /tmp/oxjs/tools/build/build.py
          cp -R /tmp/oxjs/min frontend_oxjs/min

      - name: Install
        working-directory: ./frontend_oxjs
        run: npm ci

      - name: Build
        working-directory: ./frontend_oxjs
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to GH Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend_oxjs/build
